<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Not found — OnDevice</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<style>
  :root {
    --bg: #0a0b0d; --bg-raised: #121418; --line: #1f232b; --line-bright: #2c323d;
    --text: #e6e9ef; --text-dim: #9aa3b2; --text-faint: #6b7484; --accent: #5eead4;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbfcfd; --bg-raised: #fff; --line: #e3e7ed; --line-bright: #d0d6e0;
      --text: #10131a; --text-dim: #515c6e; --text-faint: #7c8698; --accent: #0d9488;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans);
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 24px;
  }
  .box { max-width: 460px; width: 100%; }
  .code { font-family: var(--mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 14px; }
  h1 { font-size: clamp(1.7rem, 5vw, 2.2rem); letter-spacing: -0.025em; line-height: 1.12; margin: 0 0 14px; font-weight: 680; }
  p { color: var(--text-dim); margin: 0 0 28px; font-size: 14.6px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 9px;
    font-size: 14.2px; font-weight: 560; text-decoration: none;
    border: 1px solid var(--line-bright); color: var(--text); transition: border-color .15s;
  }
  a.btn:hover { border-color: var(--text-faint); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: #04231f; }
  @media (prefers-color-scheme: light) { a.btn.primary { color: #fff; } }
  .path { font-family: var(--mono); font-size: 12.4px; color: var(--text-faint); background: var(--bg-raised); border: 1px solid var(--line); border-radius: 9px; padding: 11px 14px; margin-bottom: 26px; overflow-wrap: anywhere; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">404 · not resident</div>
    <h1>Nothing is loaded at this path.</h1>
    <div class="path" id="p">/</div>
    <p>The site covers two builds of one local runtime. Both live on the home page — the studio for driving models yourself, the server for letting your tools drive them.</p>
    <div class="row">
      <a class="btn primary" href="/">Back to OnDevice</a>
      <a class="btn" href="/#editions">Downloads</a>
      <a class="btn" href="/#server">Server build</a>
    </div>
  </div>
<script>
  document.getElementById('p').textContent = location.pathname + (location.search || '');
</script>
</body>
</html>
